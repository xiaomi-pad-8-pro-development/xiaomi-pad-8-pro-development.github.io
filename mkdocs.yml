site_name: Xiaomi Pad 8 Pro (piano)
site_url: https://xiaomi-pad-8-pro-development.github.io/
repo_url: https://github.com/xiaomi-pad-8-pro-development
repo_name: xiaomi-pad-8-pro-development
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.instant, content.code.copy]
markdown_extensions: [admonition, tables, toc: {permalink: true}]
nav:
  - Home: index.md
  - Install: install.md
  - Kernels: kernels.md
  - Recovery: recovery.md
  - Build from source: building.md
  - Repositories: repos.md
  - Known issues and FAQ: faq.md
  - Contributing: contributing.md
